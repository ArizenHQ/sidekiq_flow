services:
  sidekiq_flow:
    build:
      context: '.'
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://:password@valkey:6379
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:9.1-alpine
    command: valkey-server --requirepass password
    expose:
      - 6379
